<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>День творчості та інновацій</title>
<style>
:root{font-family:Arial,'Segoe UI',sans-serif;color:#fff;--nav:#082a80;--cyan:#0cb5ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#092f7d;overflow:hidden}button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid #ffe45e;outline-offset:3px}#app{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 72px}#stage{position:relative;overflow:hidden;min-height:0;background:linear-gradient(140deg,#00a4ee,#0753a5)}.scene{position:absolute;inset:0;display:none;overflow:hidden}.scene.active{display:block}.bg{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0}.cover{object-fit:cover}.overlay{position:absolute;inset:0;pointer-events:none}.overlay>*{pointer-events:auto}.pill{border:2px solid #83eaff;border-radius:24px;padding:12px 23px;color:#fff;font-size:clamp(15px,1.65vw,24px);font-weight:900;text-shadow:0 2px 3px #123b70;background:linear-gradient(#30d9ff,#0062d4 65%,#0241a5);box-shadow:0 6px 0 #00347e,0 10px 22px #01274780}.pill:active{transform:translateY(4px);box-shadow:0 2px 0 #00347e}.pill.orange{background:linear-gradient(#ffdc65,#ff8520 65%,#d84f00);border-color:#fff0a1;box-shadow:0 6px 0 #a14302,0 10px 20px #0005}.pill.green{background:linear-gradient(#8aff68,#28b731 70%,#0d7c20);border-color:#deffb2;box-shadow:0 6px 0 #08651c,0 10px 20px #0005}.pill.purple{background:linear-gradient(#e9a4ff,#9e44ef 65%,#7021ba);border-color:#ffd1ff;box-shadow:0 6px 0 #4a178f,0 10px 20px #0005}.box{border:3px solid #37daff;background:linear-gradient(145deg,#03417edb,#091f6bea);border-radius:22px;padding:18px 24px;box-shadow:0 9px 35px #0017478a;color:white}.caption{font-size:clamp(19px,2.4vw,38px);font-weight:900;line-height:1.18;text-align:center;text-shadow:0 3px 7px #001f56}.small{font-size:clamp(16px,1.5vw,24px)}.place-bottom{position:absolute;bottom:4%;left:50%;transform:translateX(-50%)}.place-top{position:absolute;top:4%;left:50%;transform:translateX(-50%)}.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.wide{width:min(88%,1100px)}.nav{background:linear-gradient(#0d5fc4,#052b79);display:flex;align-items:center;justify-content:center;gap:14px;border-top:3px solid #65d9ff;padding:8px 12px;box-shadow:0 -3px 18px #00206355;z-index:30}.nav button{padding:10px 22px;min-width:115px;border-radius:20px;border:2px solid #82e5ff;background:linear-gradient(#28d0ff,#0069cc);color:white;font-weight:900;font-size:clamp(14px,1.45vw,20px);box-shadow:0 3px 0 #002b7b}.nav button:disabled{opacity:.4;cursor:default}.nav #counter{font-weight:900;min-width:80px;text-align:center}#notice{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:40;background:#042866e8;padding:10px 15px;border-radius:12px;display:none}.riddle-text{position:absolute;left:12%;top:24%;width:55%;font-size:clamp(24px,3.1vw,52px);font-weight:900;color:#fff;text-shadow:0 3px 9px #0062aa,0 2px 3px #001a69}.riddle-line{margin:8px 0;animation:fade .45s both}.riddle-answer{font-size:clamp(42px,6vw,90px);color:#ffdf31;text-shadow:0 5px 6px #ad5800}.riddle-next{position:absolute;bottom:8%;left:28%;transform:translateX(-50%)}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.video{position:absolute;width:100%;height:100%;object-fit:contain;background:#061d50}.video-action{position:absolute;bottom:5%;right:5%}.hotspot{position:absolute;border:0;background:transparent;border-radius:22px}.hotspot:hover{box-shadow:inset 0 0 0 3px #fff9}.water-wrap{position:absolute;left:35%;top:18%;width:34%;height:67%;pointer-events:none}.water-wrap .tank{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.water-object{position:absolute;left:50%;top:7%;max-width:42%;height:23%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 5px 7px #003b6277)}.water-object.falling{animation:fall 1.7s ease-in-out forwards}.water-object.floater{animation:bob 2.5s ease-in-out infinite alternate}@keyframes fall{0%{top:7%}65%{top:43%}82%{top:40%}100%{top:42%}}@keyframes sink{0%{top:7%}70%{top:72%}100%{top:72%}}@keyframes bob{from{top:40%}to{top:43%}}.water-object.sinking{animation:sink 1.6s ease-out forwards}.water-numbers{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);display:flex;gap:11px}.water-numbers button{width:clamp(40px,4vw,62px);height:clamp(40px,4vw,62px);padding:0;border-radius:50%}.water-numbers button.selected{border-color:#ffe944;box-shadow:0 0 0 4px #fff8,0 6px 0 #00347e}.water-result{position:absolute;top:3%;right:3%;max-width:31%;font-size:clamp(16px,1.5vw,24px)}.water-journal{position:absolute;left:2.5%;top:20%;width:28%;max-height:57%;object-fit:contain;filter:drop-shadow(0 6px 15px #001a5f60)}.mic-step{position:absolute;left:50%;bottom:3%;transform:translateX(-50%)}.lens{position:absolute;left:58%;top:18%;width:30%;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px #04a6db,0 7px 20px #002a7b80}.mic-buttons{position:absolute;right:5%;bottom:7%;display:flex;gap:10px}.observ-telescope{position:absolute;left:8%;bottom:10%;width:40%;height:71%;object-fit:contain;transform-origin:50% 73%;filter:drop-shadow(0 8px 14px #020d42a0);transition:transform 1s ease}.observ-telescope.turned{transform:rotate(-13deg)}.sky-circle{position:absolute;right:9%;top:12%;width:min(43vw,47vh);aspect-ratio:1;border-radius:50%;object-fit:contain;filter:drop-shadow(0 4px 20px #0009)}.sky-tip{position:absolute;bottom:6%;right:5%;max-width:43%}.taurus-control{position:absolute;bottom:5%;right:6%;display:flex;gap:12px}.full-screen-picture{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.final-cards{position:absolute;bottom:19%;left:7%;width:86%;display:flex;gap:12px}.flip{width:25%;aspect-ratio:2.65;position:relative;border:0;padding:0;background:none;perspective:900px}.flip-inner{display:block;position:relative;width:100%;height:100%;transition:transform .65s;transform-style:preserve-3d}.flip.flipped .flip-inner{transform:rotateY(180deg)}.flip-face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;border-radius:18px;overflow:hidden}.flip-face img{width:100%;height:100%;object-fit:fill}.flip-back{transform:rotateY(180deg);padding:8px;background:linear-gradient(135deg,#085db9,#0b2e87);border:3px solid #8be8ff;font-size:clamp(11px,1.4vw,23px);font-weight:900}.missing{background:#032867;border:3px dashed #ffc935;color:#fff;text-align:center;position:absolute;left:20%;right:20%;top:27%;padding:22px;z-index:20;font-size:20px}.center-card{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:min(90%,900px)}.note{font-size:clamp(16px,1.65vw,26px);line-height:1.4}.copyright{position:absolute;right:15px;bottom:4px;font-weight:800;font-size:11px;color:#fff9;pointer-events:none}@media(max-width:700px){#app{grid-template-rows:minmax(0,1fr) 62px}.nav{gap:7px}.nav button{min-width:auto;padding:9px 13px}.riddle-text{top:20%;width:75%;left:8%}.riddle-next{left:50%}.water-journal{width:26%;top:16%}.water-wrap{left:30%;width:44%}.water-result{top:2%;right:2%;max-width:35%}.water-numbers{gap:5px}.observ-telescope{left:3%;width:49%}.sky-circle{right:3%;width:46vw}.final-cards{bottom:27%;left:3%;width:94%;gap:4px}.flip-back{font-size:10px}}
</style></head><body>
<div id="app"><main id="stage" aria-label="Інтерактивний урок День творчості та інновацій"><div id="notice" role="status"></div></main><nav class="nav"><button id="prev" type="button">◀ Назад</button><span id="counter" aria-live="polite"></span><button id="next" type="button">Далі ▶</button><button id="home" type="button" title="На початок">⌂</button><button id="full" type="button" title="На весь екран">⛶</button></nav></div>
<script>
'use strict';
// ВАЖЛИВО: файли завантажуються поряд з index.html, без перейменування.
const ASSET={hero:'hero_background.png',title:'title_3d.png',riddle:'riddle_background.png',intro:'autumn_intro_silent.mp4',leafVideo:'leaf_talking.mp4',mic1:'microscope_01_overview.png',mic2:'microscope_02_select_leaf.png',mic3:'microscope_03_compare_leaves.png',mic4:'microscope_04_discovery.png',green:'micro_leaf_green_lens.png',yellow:'micro_leaf_yellow_lens.png',waterBg:'water_autumn_background.png',tank:'water_tank.png',journal:'water_journal_frame.png',selection:'water_selection_panel.png',leaf:'water_leaf.png',apple:'water_apple.png',pear:'water_pear.png',plum:'water_plum.png',stone:'water_stone.png',sky:'november_sky_background.png',observ:'observatory_research_background.png',telescope:'telescope_main.png',eye:'telescope_eyepiece_view.png',ald:'telescope_aldebaran_closeup.png',hyades:'telescope_hyades_closeup.png',pleiades:'telescope_pleiades_closeup.png',taurus:'telescope_taurus_overview.png',horns:'telescope_taurus_horns.png',bull:'telescope_taurus_bull_art.png',room:'taurus_room_intro.png',punch:'taurus_punch_card.png',punchAnswer:'taurus_punch_card_teacher_check.png',art:'creative_workshop_background.png',final:'final_scene_background.png',c1:'final_card_01_research.png',c2:'final_card_02_art.png',c3:'final_card_03_construction.png',c4:'final_card_04_creation.png'};
const stage=document.getElementById('stage'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');
const img=(file,cls='bg',alt='')=>`<img class="${cls}" src="${ASSET[file]}" alt="${alt.replace(/"/g,'&quot;')}" loading="lazy">`;
const scenes=[
['Титульна сцена',()=>`${img('hero')}${img('title','overlay-title','День творчості та інновацій')}<div class="overlay"><button class="pill orange place-bottom" data-next>РОЗПОЧАТИ ПОДОРОЖ ▶</button></div>`],
['Загадка про осінь',()=>`${img('riddle')}<div class="riddle-text" id="riddleText"></div><div class="overlay"><button class="pill orange riddle-next" id="riddleButton">НАСТУПНИЙ РЯДОК ▶</button></div>`],
['Осіння відеозаставка',()=>`<video class="video" id="introVideo" src="${ASSET.intro}" playsinline controls preload="metadata"></video><div class="overlay"><button class="pill video-action" id="playIntro">▶ ВІДТВОРИТИ</button></div>`],
['Знайомство з Листочком',()=>`<video class="video" id="leafVideo" src="${ASSET.leafVideo}" playsinline controls preload="metadata"></video><div class="overlay"><button class="pill video-action" id="playLeaf">▶ СЛУХАЄМО ЛИСТОЧКА</button></div>`],
['Мікроскоп. Перше знайомство',()=>`${img('mic1')}<div class="overlay"><button class="hotspot" style="left:61%;top:24%;width:29%;height:44%" data-next aria-label="Перейти до вибору листочка"></button></div>`],
['Вибираємо листочок',()=>`${img('mic2')}<div class="overlay"><div class="mic-buttons"><button class="pill green" data-lens="green">ЗЕЛЕНИЙ</button><button class="pill orange" data-lens="yellow">ОСІННІЙ</button></div></div><img id="microLens" class="lens" src="${ASSET.green}" alt="Збільшений зелений листок" hidden>`],
['Порівнюємо листочки',()=>`${img('mic3')}<div class="overlay"><button class="hotspot" data-next style="left:76%;top:65%;width:20%;height:22%" aria-label="Наступне відкриття"></button></div>`],
['Відкриття під мікроскопом',()=>`${img('mic4')}`],
['Дослід із водою',()=>`${img('waterBg')}${img('journal','water-journal','Журнал дослідника')}<div class="water-wrap">${img('tank','tank','Прозора посудина з водою')}<img id="waterObject" class="water-object" src="" alt="" hidden></div><div class="water-result box" id="waterResult" aria-live="polite">Обери номер досліду: ① ② ③ ④ ⑤</div><div class="water-numbers" id="waterNumbers"></div>`],
['Осіннє небо',()=>`${img('sky')}<div class="overlay"><div class="place-bottom"><button class="pill" data-next>ДО ОБСЕРВАТОРІЇ ▶</button></div></div>`],
['Обсерваторія',()=>`${img('observ')}${img('telescope','observ-telescope','Телескоп')}<div class="overlay"><button class="pill orange" id="turnTelescope" style="position:absolute;right:8%;bottom:12%">🔭 ПОВЕРНУТИ ТЕЛЕСКОП</button></div>`],
['Цифровий телескоп',()=>`${img('observ')}<img class="sky-circle" id="skyView" src="${ASSET.eye}" alt="Зоряне небо у телескопі"><div class="overlay"><div class="taurus-control"><button class="pill" id="nextStar">НАСТУПНЕ ВІДКРИТТЯ ✦</button></div><div class="sky-tip box small" id="skyCaption">Розглянь зоряне небо. Що помічаєш?</div></div>`],
['Сузір’я у твоїй кімнаті',()=>`${img('room')}<div class="overlay"><button class="pill green" style="position:absolute;right:5%;bottom:5%" id="showPattern">ПЕРЕВІРИТИ СУЗІР’Я</button></div>`],
['Схема сузір’я',()=>`${img('punch','full-screen-picture','Картка з крапками сузір’я')}<div class="overlay"><button class="pill" style="position:absolute;right:5%;bottom:6%" id="togglePattern">ПОКАЗАТИ ЗРАЗОК</button></div>`],
['Художня студія',()=>`${img('art')}<div class="overlay"><button class="pill orange place-bottom" id="artStep">ЯК СТВОРИТИ ВІДБИТОК ЛИСТКА?</button><div id="artHelp" class="box center-card note" hidden>Поклади листочок прожилками догори, нанеси на нього фарбу пензликом, притисни до аркуша й обережно підніми. Який відбиток утворився? <button class="pill green" id="artClose">ЗРОЗУМІЛО</button></div></div>`],
['Наші відкриття',()=>`${img('final')}<div class="final-cards" id="finalCards"></div>`]
];
// 16 послідовних повноекранних сцен, без сторонніх зображень.
let sceneIndex=0,riddleStep=0,starStep=0;const riddleLines=['В жовте лист пофарбувала,','Урожай з полів зібрала.','Золотила вербам коси','Чарівна цариця – …'];
function go(n){sceneIndex=Math.max(0,Math.min(scenes.length-1,n));render()}
function render(){stage.replaceChildren();const sc=document.createElement('section');sc.className='scene active';sc.setAttribute('aria-label',scenes[sceneIndex][0]);sc.innerHTML=scenes[sceneIndex][1]();stage.appendChild(sc);counter.textContent=`${sceneIndex+1} / ${scenes.length}`;prev.disabled=sceneIndex===0;next.disabled=sceneIndex===scenes.length-1;document.title=`${scenes[sceneIndex][0]} — День творчості та інновацій`;sc.querySelectorAll('[data-next]').forEach(el=>el.addEventListener('click',()=>go(sceneIndex+1)));sc.querySelectorAll('img').forEach(el=>el.addEventListener('error',()=>{el.style.visibility='hidden';let notice=document.getElementById('notice');notice.textContent=`Не завантажено файл: ${decodeURIComponent(el.getAttribute('src'))}`;notice.style.display='block'}));document.getElementById('notice').style.display='none';initScene()}
function initScene(){if(sceneIndex===0){const t=stage.querySelector('.overlay-title');Object.assign(t.style,{position:'absolute',width:'58%',height:'auto',objectFit:'contain',top:'3%',left:'21%',pointerEvents:'none',maxHeight:'31%'})}
if(sceneIndex===1){riddleStep=0;updateRiddle();document.getElementById('riddleButton').onclick=()=>{if(riddleStep<5){riddleStep++;updateRiddle()}else go(2)}}
if(sceneIndex===2||sceneIndex===3){const video=document.querySelector('video');const b=document.querySelector(sceneIndex===2?'#playIntro':'#playLeaf');b.onclick=()=>{video.paused?video.play().catch(()=>{}):video.pause()};video.onended=()=>{b.textContent='↻ ПОВТОРИТИ';b.onclick=()=>{video.currentTime=0;video.play().catch(()=>{})}}}
if(sceneIndex===5){document.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{const k=b.dataset.lens;const l=document.getElementById('microLens');l.hidden=false;l.src=ASSET[k];l.alt=k==='green'?'Збільшений зелений листок':'Збільшений осінній листок'})}
if(sceneIndex===8){const items=[['leaf','Листочок','Плаває біля поверхні','float'],['apple','Яблуко','Зазвичай плаває','float'],['pear','Груша','Результат залежить від сорту та стиглості','float'],['plum','Слива','Часто тоне у воді','sink'],['stone','Камінець','Тоне у воді','sink']];const row=document.getElementById('waterNumbers');items.forEach(([key,name,label,mode],i)=>{let b=document.createElement('button');b.className='pill';b.textContent=i+1;b.title=name;b.setAttribute('aria-label',`${i+1}. ${name}`);b.onclick=()=>{row.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const el=document.getElementById('waterObject');el.hidden=false;el.className='water-object';el.src=ASSET[key];el.alt=name;void el.offsetWidth;el.classList.add(mode==='sink'?'sinking':'falling');if(mode==='float')el.addEventListener('animationend',()=>{if(el.src.endsWith(ASSET[key]))el.className='water-object floater'},{once:true});document.getElementById('waterResult').textContent=`${i+1}. ${name}. ${label}. Перевір дослідом!`};row.appendChild(b)})}
if(sceneIndex===10){document.getElementById('turnTelescope').onclick=()=>{const t=document.querySelector('.observ-telescope');t.classList.toggle('turned');document.getElementById('turnTelescope').textContent=t.classList.contains('turned')?'✓ ТЕЛЕСКОП ПОВЕРНУТО':'🔭 ПОВЕРНУТИ ТЕЛЕСКОП'}}
if(sceneIndex===11){starStep=0;document.getElementById('nextStar').onclick=()=>{const keys=['eye','ald','hyades','pleiades','horns','taurus','bull'];const names=['Зоряне небо. Що помічаєш?','Альдебаран — яскрава зоря сузір’я Тельця.','Гіади — зоряне скупчення.','Плеяди — відоме зоряне скупчення.','Тепер бачимо частину ліній сузір’я.','Ось схема сузір’я Тельця.','А так художник уявив зоряного Тельця.'];starStep=(starStep+1)%keys.length;document.getElementById('skyView').src=ASSET[keys[starStep]];document.getElementById('skyCaption').textContent=names[starStep]}}
if(sceneIndex===12){document.getElementById('showPattern').onclick=()=>go(13)}
if(sceneIndex===13){let check=false;document.getElementById('togglePattern').onclick=()=>{check=!check;document.querySelector('.full-screen-picture').src=ASSET[check?'punchAnswer':'punch'];document.getElementById('togglePattern').textContent=check?'ПРИХОВАТИ ЗРАЗОК':'ПОКАЗАТИ ЗРАЗОК'}}
if(sceneIndex===14){document.getElementById('artStep').onclick=()=>{document.getElementById('artHelp').hidden=false};document.getElementById('artClose').onclick=()=>{document.getElementById('artHelp').hidden=true}}
if(sceneIndex===15){const questions=['Що сьогодні вдалося дослідити?','Що нового ти навчився малювати?','Що допомогло тобі конструювати?','Що ти хотів би створити сам?'];['c1','c2','c3','c4'].forEach((key,i)=>{let b=document.createElement('button');b.className='flip';b.setAttribute('aria-label',`Картка ${i+1}. Відкрити запитання`);b.innerHTML=`<span class="flip-inner"><span class="flip-face"><img src="${ASSET[key]}" alt="Картка ${i+1}"></span><span class="flip-face flip-back">${questions[i]}</span></span>`;b.onclick=()=>b.classList.toggle('flipped');document.getElementById('finalCards').appendChild(b)})}}
function updateRiddle(){const area=document.getElementById('riddleText');const button=document.getElementById('riddleButton');area.innerHTML=riddleLines.slice(0,Math.min(riddleStep,4)).map(s=>`<div class="riddle-line">${s}</div>`).join('');if(riddleStep>=5){area.innerHTML+='<div class="riddle-line riddle-answer">ОСІНЬ!</div>';button.textContent='ДО ПРИГОДИ ▶'}else if(riddleStep===4){button.textContent='ВІДКРИТИ ВІДГАДКУ ✨'}else button.textContent='НАСТУПНИЙ РЯДОК ▶'}
prev.onclick=()=>go(sceneIndex-1);next.onclick=()=>go(sceneIndex+1);document.getElementById('home').onclick=()=>go(0);document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(sceneIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(sceneIndex-1)}});render();
</script></body></html>
