if(page===8){add(base('wbg')+I('journal','journal','alt="Журнал дослідника"')+'<div class="journal-ticks">'+[0,1,2,3,4].map(i=>'<span class="journal-check" data-jrow="'+i+'"></span>').join('')+'</div>'+I('tank','jar','alt="Одна посудина з водою"')+'<img id="water-object" class="water-item ui" hidden>'+`<div class="water-controls ui"><div class="glass"><strong>Дари осені — дослід із водою</strong><div class="small-note">Натисніть цифру, щоб перевірити предмет.</div></div><div id="number-buttons" class="nums"></div><div id="what" class="glass small-note">Спершу висловіть припущення. Що попливе, а що потоне?</div><button id="waterreset" class="btn">↻ Повторити</button></div>`);const items=[['apple','Яблуко','Плаває',42],['pear','Груша','Плаває в нашій моделі',43],['plum','Слива','Тоне',64],['leaf','Листочок','Плаває',39],['stone','Камінець','Тоне',67]];const row=document.getElementById('number-buttons'),item=document.getElementById('water-object');function doWater(idx){const[k,n,txt,top]=items[idx];waterDone.add(idx);[...row.children].forEach((x,j)=>x.classList.toggle('selected',j===idx));item.hidden=false;item.classList.remove('floating-item');item.style.transition='none';item.style.top='7%';item.style.width=k==='leaf'?'13%':k==='stone'?'10%':'11%';item.src=A(k);item.alt=n;void item.offsetWidth;item.style.transition='top 1.65s cubic-bezier(.32,.8,.25,1)';item.style.top=top+'%';document.getElementById('what').innerHTML=`<strong>${n}</strong>: ${txt}.<div class="small-note">Познач результат у журналі разом із класом (${waterDone.size}/5).</div>`;setTimeout(()=>{const spot=document.querySelector('[data-jrow="'+idx+'"]');if(spot){spot.classList.add('mark');spot.classList.toggle('is-sink',top>=50)}},1700);if(top<50)setTimeout(()=>{if(!item.hidden)item.classList.add('floating-item')},1700)}items.forEach((x,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=i+1;b.title=x[1];b.setAttribute('aria-label',x[1]);b.onclick=()=>doWater(i);row.appendChild(b)});click('waterreset',()=>{item.hidden=true;waterDone.clear();document.querySelectorAll('.journal-check').forEach(x=>x.classList.remove('mark'));[...row.children].forEach(x=>x.classList.remove('selected'));document.getElementById('what').textContent='Спершу висловіть припущення. Що попливе, а що потоне?'});}
if(page===9){add(base('sky')+`<div class="stars" id="stars"></div><div class="glass ui" style="left:4%;bottom:7%;width:46%">У листопаді небо приховує дивовижні таємниці. Що ми можемо побачити серед зір?</div>`+B('skynext','До обсерваторії ▶','','right:4%;bottom:7%'));stars();click('skynext',()=>nav(10));}
if(page===10){add(base('observ')+'<div class="stars" id="stars"></div>'+'<div class="meteors" id="meteors"></div>'+`<div class="glass ui" style="right:4%;top:13%;width:39%"><strong>Обсерваторія</strong><div id="obstext">Спрямуємо телескоп у листопадове небо?</div></div>`+`<div class="action-row ui" style="right:4%;bottom:6%;width:51%"><button class="btn" id="aim">🔭 Навести телескоп</button><button class="btn purple" id="meteor">☄ Зорепад</button><button class="btn green" id="skygo">Дивитися в окуляр ▶</button></div>`);stars();click('aim',()=>{document.querySelector('.active-scene').classList.toggle('aimed-observ');document.getElementById('obstext').textContent='Телескоп наведено. А тепер спостерігай за небом!'});click('meteor',()=>{const box=document.getElementById('meteors');box.innerHTML='';for(let i=0;i<3;i++)setTimeout(()=>{const m=document.createElement('span');m.className='meteor';m.style.animationDuration=(1+i*.35)+'s';m.style.top=(i*7)+'%';box.appendChild(m);setTimeout(()=>m.remove(),2200)},i*480);document.getElementById('obstext').textContent='Метеори — світлові сліди частинок, що згорають у земній атмосфері.'});click('skygo',()=>nav(11));}
if(page===11){const views=['pleiades','ald','hyades','horns','eye','taurus','bull'];const captions=['Що можна розгледіти серед цих блакитних зір?','Альдебаран — яскрава помаранчева зоря.','Гіади — зоряне скупчення.','Придивися до зір, які нагадують роги.','Як уявні лінії поєднують зорі?','Тепер порівняй розташування зір із сузір’ям Тельця.','Люди уявляли серед цих зір бика. Саме тому сузір’я назвали Тельцем. Справжніх ліній між зорями немає.'];starStep=0;add(base('sky')+`<div class="stars" id="stars"></div><img id="starview" class="scope-lens" src="${A(views[0])}"><div class="glass ui" style="left:4%;top:13%;width:42%"><strong>Таємниці сузір’я</strong><div id="startext">${captions[0]}</div><div style="margin-top:10px" id="starnum">Відкриття 1 / 7</div></div><div class="action-row ui" style="right:4%;bottom:7%;width:58%"><button class="btn purple" id="starback">◀ Попереднє</button><button class="btn" id="starnext">Наступне відкриття ✦</button></div>`);stars();function upd(){document.getElementById('starview').src=A(views[starStep]);document.getElementById('startext').textContent=captions[starStep];document.getElementById('starnum').textContent=`Відкриття ${starStep+1} / 7`;}click('starnext',()=>{if(starStep<6){starStep++;upd()}else nav(12)});click('starback',()=>{starStep=Math.max(0,starStep-1);upd()});}
if(page===12){add(base('room')+B('roomgo','Виготовляємо власне сузір’я ▶','green','right:3%;bottom:5%'));click('roomgo',()=>nav(13));}
if(page===13){add(base('sky')+I('card','teacher-card')+`<div class="glass ui" style="right:5%;top:16%;width:35%"><strong>Картка зоряного неба</strong><div>1. Намалюй точки на картоні.</div><div>2. Зроби отвори за допомогою дорослого.</div><div>3. Освіти картку ліхтариком.</div><div>4. Які зорі ти побачиш?</div></div>`+`<div class="action-row ui" style="right:5%;bottom:9%;width:35%"><button class="btn" id="check">Перевірити схему</button><button class="btn dim" id="light">🔦 Світло</button></div><div class="stars" id="stars" style="opacity:0;transition:opacity 1s"></div>`);let checked=false,lit=false;click('check',()=>{checked=!checked;document.querySelector('.teacher-card').src=A(checked?'cardcheck':'card');document.getElementById('check').textContent=checked?'Приховати схему':'Перевірити схему'});click('light',()=>{lit=!lit;document.getElementById('stars').style.opacity=lit?'1':'0';if(lit)stars()});}
if(page===14){add(base('art')+`<div class="glass art-panel ui"><strong>Листочок залишає слід</strong><div>Поклади листок прожилками вгору. Нанеси фарбу, притисни до паперу й обережно підніми.</div><div style="margin-top:10px">Який відбиток утворився?</div></div>`+B('artok','Наш творчий результат ✓','orange','left:3%;bottom:7%'));click('artok',()=>toast('Покажіть свою роботу на камеру!'))}
if(page===15){add(base('final')+`<div class="final-question">Чим корисним став урок?</div><div class="cards" id="cards"></div>`);let titles=['ДОСЛІДЖУЄМО','МАЛЮЄМО','КОНСТРУЮЄМО','СТВОРЮЄМО'];let q=['Що нового ти сьогодні дослідив?','Який творчий прийом запам’ятав?','Як ти створив власне сузір’я?','Що хочеш дослідити наступного разу?'];['c1','c2','c3','c4'].forEach((k,i)=>{const b=document.createElement('button');b.className='flip';b.setAttribute('aria-label','Відкрити картку '+(i+1));b.innerHTML=`<span class="flip-inner"><span class="flip-front"><img src="${A(k)}" alt="Картка ${i+1}"><span class="flip-label">${titles[i]}</span></span><span class="flip-back">${q[i]}</span></span>`;b.onclick=()=>b.classList.toggle('open');document.getElementById('cards').appendChild(b)})}
root.querySelectorAll('img').forEach(im=>{im.onerror=()=>toast('Помилка відкриття файлу: '+im.getAttribute('src'))});}
function stars(){const layer=document.getElementById('stars');if(!layer)return;layer.replaceChildren();for(let i=0;i<52;i++){let s=document.createElement('span');s.className='star';s.style.left=(4+(i*73.7)%92)+'%';s.style.top=(3+(i*31.39)%79)+'%';s.style.setProperty('--dur',(1.2+(i%7)*.31)+'s');s.style.width=s.style.height=(i%9===0?5:2)+'px';layer.appendChild(s)}}
document.getElementById('first').onclick=()=>nav(0);document.getElementById('back').onclick=()=>nav(page-1);document.getElementById('forward').onclick=()=>nav(page+1);document.getElementById('sound').onclick=()=>{mute=!mute;document.getElementById('sound').textContent=mute?'🔇':'🔊';let video=document.getElementById('vid');if(video)video.muted=mute};document.getElementById('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('app').requestFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();nav(page+1)}else if(e.key==='ArrowLeft'){e.preventDefault();nav(page-1)}});render();
</script></body></html>
